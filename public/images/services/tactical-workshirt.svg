<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141813" />
      <stop offset="100%" stop-color="#222920" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2c3629" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#grid)" />
  
  <!-- Tactical badge motif -->
  <polygon points="400,120 490,170 490,290 400,340 310,290 310,170" fill="#1b211a" stroke="#A4B66A" stroke-width="3" />
  <circle cx="400" cy="230" r="55" fill="none" stroke="#A4B66A" stroke-width="2" stroke-dasharray="6 4" />
  <path d="M375,230 L425,230 M400,205 L400,255" stroke="#A4B66A" stroke-width="3" stroke-linecap="round"/>

  <!-- Tactical Shirt Silhouette Lines -->
  <path d="M260,380 L350,340 L450,340 L540,380 L520,490 L480,480 L480,510 L320,510 L320,480 L280,490 Z" fill="#192018" stroke="#3d4938" stroke-width="2" />
  
  <rect x="240" y="525" width="320" height="4" rx="2" fill="#A4B66A" />
  <text x="400" y="555" fill="#F3F3ED" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="2" text-anchor="middle">TACTICAL &amp; WORKSHIRT</text>
  <text x="400" y="580" fill="#A5ACA1" font-family="system-ui, sans-serif" font-size="13" letter-spacing="1" text-anchor="middle">PRECISION CUT &amp; HEAVY DUTY CONSTRUCTION</text>
</svg>
